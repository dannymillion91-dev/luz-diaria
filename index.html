// Adaptador local: emula la API window.storage de los artefactos de claude.ai
// usando el almacenamiento del navegador. Así funciona igual en claude.ai y en local.
window.storage = {
  async get(key, shared) {
    const value = localStorage.getItem('storage:' + key);
    return value === null ? null : { key, value };
  },
  async set(key, value, shared) {
    localStorage.setItem('storage:' + key, String(value));
    return { key, value };
  },
  async delete(key, shared) {
    localStorage.removeItem('storage:' + key);
    return true;
  }
};

// Registro del service worker (para instalar y funcionar sin internet)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ---------- Funciones auxiliares de fecha ----------
function pad(n) { return String(n).padStart(2, '0'); }

function todayStr() {
  return dateNDaysAgo(0);
}

function dateNDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function last30Days() {
  const days = [];
  for (let i = 29; i >= 0; i--) days.push(dateNDaysAgo(i));
  return days;
}

function calcStreak(checks) {
  let i = checks[todayStr()] ? 0 : 1;
  let streak = 0;
  while (checks[dateNDaysAgo(i)]) { streak++; i++; }
  return streak;
}

function calcBestStreak(checks) {
  const dates = Object.keys(checks).filter((d) => checks[d]).sort();
  let best = 0, current = 0, prev = null;
  for (const d of dates) {
    if (prev && (new Date(d) - new Date(prev)) / 86400000 === 1) current++;
    else current = 1;
    if (current > best) best = current;
    prev = d;
  }
  return best;
}

function calcMonthPct(checks) {
  const cells = currentMonthCells();
  const total = cells.filter((c) => c.valid).length;
  const marked = cells.filter((c) => c.valid && checks[c.date]).length;
  return total ? Math.round((marked / total) * 100) : 0;
}

const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS_SEMANA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

// Convierte '2026-07-05' en 'Martes 5 de julio' (fecha completa y legible)
function friendlyDate(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const nombre = DIAS_SEMANA[dt.getDay()];
  return `${nombre.charAt(0).toUpperCase()}${nombre.slice(1)} ${d} de ${MESES[m - 1]}`;
}
const YEARS = [2024, 2025, 2026, 2027, 2028, 2029, 2030];
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); } // month 1-12

// Genera SIEMPRE 31 cuadritos del mes actual. Los días que el mes no tiene
// (p. ej. el 31 en un mes de 30) se marcan como no válidos: quedan vacíos e inactivos.
function currentMonthCells() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1; // 1-12
  const dim = daysInMonth(year, month);
  const cells = [];
  for (let day = 1; day <= 31; day++) {
    if (day <= dim) {
      cells.push({ day, date: `${year}-${pad(month)}-${pad(day)}`, valid: true });
    } else {
      cells.push({ day, date: null, valid: false });
    }
  }
  return cells;
}

// ============================================================
//  BÓVEDA CIFRADA — todo lo que ella escribe se guarda cifrado
//  con su contraseña (Web Crypto: PBKDF2 + AES-GCM). Sin la clave,
//  nadie puede leerlo. No hay puerta trasera.
// ============================================================
const _enc = new TextEncoder();
const _dec = new TextDecoder();
let VAULT_KEY = null; // CryptoKey en memoria durante la sesión (se borra al cerrar)
const VAULT_TOKEN = 'luz-dorada-del-ser-ok';

function _bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function _b64ToBytes(b64) {
  const s = atob(b64);
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}

async function _deriveKey(password, salt) {
  const base = await crypto.subtle.importKey('raw', _enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function _encryptStr(key, plaintext) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, _enc.encode(plaintext));
  return JSON.stringify({ iv: _bufToB64(iv), ct: _bufToB64(ct) });
}
async function _decryptStr(key, blob) {
  const { iv, ct } = JSON.parse(blob);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: _b64ToBytes(iv) }, key, _b64ToBytes(ct));
  return _dec.decode(pt);
}

async function vaultGetMeta() {
  try {
    const r = await window.storage.get('vault-meta', false);
    if (r && r.value) return JSON.parse(r.value);
  } catch (e) {}
  return null;
}
async function vaultExists() { return (await vaultGetMeta()) !== null; }

async function vaultCreate(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await _deriveKey(password, salt);
  const verifier = await _encryptStr(key, VAULT_TOKEN);
  await window.storage.set('vault-meta', JSON.stringify({ v: 1, salt: _bufToB64(salt), verifier }), false);
  VAULT_KEY = key;
}
async function vaultUnlock(password) {
  const meta = await vaultGetMeta();
  if (!meta) throw new Error('sin-boveda');
  const key = await _deriveKey(password, _b64ToBytes(meta.salt));
  let token;
  try { token = await _decryptStr(key, meta.verifier); } catch (e) { throw new Error('clave-incorrecta'); }
  if (token !== VAULT_TOKEN) throw new Error('clave-incorrecta');
  VAULT_KEY = key;
}
function vaultLock() { VAULT_KEY = null; }

// Lecturas/escrituras cifradas (misma forma que window.storage)
async function secureGet(name) {
  if (!VAULT_KEY) return null;
  try {
    const r = await window.storage.get(name, false);
    if (!r || !r.value) return null;
    return { key: name, value: await _decryptStr(VAULT_KEY, r.value) };
  } catch (e) { return null; }
}
async function secureSet(name, value) {
  if (!VAULT_KEY) return null;
  const blob = await _encryptStr(VAULT_KEY, value);
  return window.storage.set(name, blob, false);
}

//  DIARIO DE SUEÑOS
// ============================================================
function DreamJournal({ onBack }) {
  const now = new Date();
  const [entries, setEntries] = useState({});
  const [loading, setLoading] = useState(true);
  const [y, setY] = useState(now.getFullYear());
  const [m, setM] = useState(now.getMonth() + 1);
  const [d, setD] = useState(now.getDate());
  const [saved, setSaved] = useState(false);
  const savedTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await secureGet('dreams-data');
        if (r && r.value) {
          const data = JSON.parse(r.value);
          if (data && data.entries) setEntries(data.entries);
        }
      } catch (e) {}
      setLoading(false);
    })();
  }, []);

  // Ajusta el día si el mes/año seleccionado tiene menos días
  const dim = daysInMonth(y, m);
  useEffect(() => {
    if (d > dim) setD(dim);
  }, [y, m]);

  const key = `${y}-${pad(m)}-${pad(d)}`;
  const text = entries[key] || '';
  const isToday = key === todayStr();
  const longDate = new Date(y, m - 1, d).toLocaleDateString('es-ES', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  });

  function persist(next) {
    try {
      secureSet('dreams-data', JSON.stringify({ entries: next }));
    } catch (e) {}
  }

  function onWrite(val) {
    setEntries((prev) => {
      const next = { ...prev };
      if (val.trim()) next[key] = val;
      else delete next[key];
      persist(next);
      return next;
    });
    setSaved(true);
    if (savedTimer.current) clearTimeout(savedTimer.current);
    savedTimer.current = setTimeout(() => setSaved(false), 1400);
  }

  function goToday() {
    const n = new Date();
    setY(n.getFullYear());
    setM(n.getMonth() + 1);
    setD(n.getDate());
  }

  function shiftDay(delta) {
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + delta);
    const ny = dt.getFullYear();
    if (ny < YEARS[0] || ny > YEARS[YEARS.length - 1]) return;
    setY(ny); setM(dt.getMonth() + 1); setD(dt.getDate());
  }

  // ---------- Dictado por voz (Web Speech API — gratis, del navegador) ----------
  const [listening, setListening] = useState(false);
  const [micSupported, setMicSupported] = useState(true);
  const [micError, setMicError] = useState('');
  const recRef = useRef(null);
  const listeningRef = useRef(false);
  const baseRef = useRef('');
  const writeRef = useRef(() => {});
  writeRef.current = onWrite; // siempre apunta al escritor de la fecha actual

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setMicSupported(false); return; }
    const rec = new SR();
    rec.lang = 'es-ES';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      let finalT = '', interimT = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const tr = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalT += tr; else interimT += tr;
      }
      if (finalT.trim()) {
        const sep = baseRef.current && !/\s$/.test(baseRef.current) ? ' ' : '';
        baseRef.current = baseRef.current + sep + finalT.trim();
      }
      const sep2 = baseRef.current && interimT.trim() ? ' ' : '';
      writeRef.current(baseRef.current + sep2 + interimT.trim());
    };
    rec.onerror = (ev) => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        setMicError('Necesito permiso del micrófono. Actívalo en el navegador y vuelve a intentar.');
      } else if (ev.error === 'no-speech') {
        setMicError('No te escuché. Acerca el micrófono e inténtalo de nuevo.');
      }
      listeningRef.current = false; setListening(false);
    };
    rec.onend = () => {
      if (listeningRef.current) { try { rec.start(); } catch (e) {} }
      else setListening(false);
    };
    recRef.current = rec;
    return () => { listeningRef.current = false; try { rec.stop(); } catch (e) {} };
  }, []);

  // Si cambia la fecha mientras dicta, detiene el dictado (para no mezclar sueños)
  useEffect(() => {
    if (listeningRef.current) {
      listeningRef.current = false; setListening(false);
      try { recRef.current && recRef.current.stop(); } catch (e) {}
    }
  }, [key]);

  function toggleMic() {
    const rec = recRef.current;
    if (!rec) return;
    setMicError('');
    if (listeningRef.current) {
      listeningRef.current = false; setListening(false);
      try { rec.stop(); } catch (e) {}
    } else {
      baseRef.current = entries[key] || '';
      listeningRef.current = true; setListening(true);
      try { rec.start(); } catch (e) {}
    }
  }

  if (loading) {
    return <div className="loading">Abriendo el diario...</div>;
  }

  const selectStyle = {

// ============================================================
//  PRÁCTICAS DIARIAS (el rastreador)
// ============================================================
function HabitTracker({ onBack }) {
  const [habits, setHabits] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modalOpen, setModalOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [formName, setFormName] = useState('');
  const [formEmoji, setFormEmoji] = useState(EMOJIS[0]);
  const [formColor, setFormColor] = useState(COLORS[0]);

  const today = todayStr();
  const cells = useMemo(() => currentMonthCells(), []); // 31 cuadritos del mes actual
  const nombreMes = MESES[new Date().getMonth()];

  useEffect(() => {
    (async () => {
      let loaded = null;
      try {
        const result = await secureGet('habits-data');
        if (result && result.value) {
          const data = JSON.parse(result.value);
          if (data && Array.isArray(data.habits)) loaded = data.habits;
        }
      } catch (e) {}
      setHabits(loaded !== null ? loaded : buildDefaultHabits());
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (loading) return;
    (async () => {
      try {
        await secureSet('habits-data', JSON.stringify({ habits }));
      } catch (e) {}
    })();
  }, [habits, loading]);

  const doneToday = useMemo(() => habits.filter((h) => h.checks[today]).length, [habits, today]);
  const allDone = habits.length > 0 && doneToday === habits.length;
  const dateLabel = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

  function openCreate() {
    setEditingId(null); setFormName(''); setFormEmoji(EMOJIS[0]); setFormColor(COLORS[0]); setModalOpen(true);
  }
  function openEdit(habit) {
    setEditingId(habit.id); setFormName(habit.name); setFormEmoji(habit.emoji); setFormColor(habit.color); setModalOpen(true);
  }
  function saveHabit() {
    const name = formName.trim();
    if (!name) return;
    if (editingId) {
      setHabits((hs) => hs.map((h) => h.id === editingId ? { ...h, name, emoji: formEmoji, color: formColor } : h));
    } else {
      setHabits((hs) => [...hs, { id: Date.now().toString(), name, emoji: formEmoji, color: formColor, checks: {} }]);
    }
    setModalOpen(false);
  }
  function deleteHabit(id) {
    if (window.confirm('¿Borrar esta práctica?')) setHabits((hs) => hs.filter((h) => h.id !== id));
  }
  function toggleCheck(habitId, date) {
    setHabits((hs) => hs.map((h) => {
      if (h.id !== habitId) return h;
      const checks = { ...h.checks };
      if (checks[date]) delete checks[date]; else checks[date] = true;
      return { ...h, checks };
    }));
  }
  function resetAll() {
    if (window.confirm('¿REINICIO GENERAL? Se vaciarán los cuadritos de TODAS las prácticas. Esto no se puede deshacer.')) {
      setHabits((hs) => hs.map((h) => ({ ...h, checks: {} })));
    }
  }

  if (loading) return <div className="loading">Cargando...</div>;

  return (
    <div className="section section-practicas view-fade">
      <div className="section-inner" style={{ maxWidth: 880 }}>
        <button className="back-link" onClick={onBack}><ArrowLeft size={16} /> Templo</button>

        {/* Header */}
        <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'flex-end', justifyContent: 'space-between', gap: 16, marginBottom: 24 }}>
          <div>
            <h1 className="mystic" style={{ fontSize: 34, fontWeight: 600, margin: 0, lineHeight: 1.1, color: GOLD }}>
              Prácticas Diarias
            </h1>
            <div style={{ color: '#c9a86a', fontSize: 13, marginTop: 4, letterSpacing: '0.06em' }}>LUZ DORADA DEL SER</div>
            <div style={{ color: '#888', fontSize: 14, marginTop: 6 }}>{dateLabel}</div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'stretch', gap: 8 }}>
            {habits.length > 0 && (
              <button className="reset-btn" onClick={resetAll}
                style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, background: 'transparent', color: '#e35d4c', border: '1px solid #c0392b', borderRadius: 10, padding: '9px 18px', fontSize: 13, fontWeight: 600, cursor: 'pointer', letterSpacing: 0.3, whiteSpace: 'nowrap' }}>
                ↺ Reiniciar todo
              </button>
            )}
            <button className="btn-primary" onClick={openCreate}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: ACCENT, color: '#2a1c06', border: 'none', borderRadius: 10, padding: '10px 18px', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
              <Plus size={16} /> Nueva práctica
            </button>
          </div>
        </div>

        {/* Banner del día */}
        {habits.length > 0 && (
          <div className="fade-in" style={{
            display: 'flex', alignItems: 'center', gap: 10, padding: '14px 18px', borderRadius: 12, marginBottom: 24, fontSize: 14,
            background: allDone ? `linear-gradient(135deg, ${ACCENT}22, ${ACCENT}08)` : '#1c1509',
            border: `1px solid ${allDone ? `${ACCENT}55` : BORDER}`,
          }}>
            {allDone ? (
              <React.Fragment>
                <Sparkles size={18} color={ACCENT} />
                <span style={{ fontWeight: 600 }}>¡Enhorabuena! Día completo.</span>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <TrendingUp size={18} color="#888" />
                <span>Hoy: <strong>{doneToday} / {habits.length}</strong> prácticas</span>
              </React.Fragment>
            )}
          </div>
        )}

        {/* Estado vacío */}
        {habits.length === 0 && (
          <div className="fade-in" style={{ border: `2px dashed ${BORDER}`, borderRadius: 14, padding: '64px 24px', textAlign: 'center' }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>🌱</div>
            <div className="serif" style={{ fontSize: 20, fontWeight: 600, marginBottom: 8 }}>Sin prácticas todavía</div>
            <div style={{ color: '#888', fontSize: 14 }}>Crea tu primera práctica para empezar a rastrear.</div>
          </div>
        )}

        {/* Tarjetas */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          {habits.map((habit) => {
            const streak = calcStreak(habit.checks);
            const best = calcBestStreak(habit.checks);
            const pct = calcMonthPct(habit.checks);
            return (
              <div key={habit.id} className="habit-card fade-in" style={{ background: '#1c1509', border: `1px solid ${BORDER}`, borderRadius: 14, padding: '18px 20px' }}>
                <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 12, marginBottom: 14 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 10, background: `${habit.color}22`, border: `1px solid ${habit.color}44`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, flexShrink: 0 }}>
                    {habit.emoji}
                  </div>
                  <div className="serif" style={{ fontSize: 18, fontWeight: 600, flex: 1, minWidth: 120 }}>{habit.name}</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 14, fontSize: 12, color: '#999', flexWrap: 'wrap' }}>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><Flame size={14} color={streak > 0 ? ACCENT : '#555'} />{streak} actual</span>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><Trophy size={14} color={best > 0 ? '#c7b87a' : '#555'} />{best} mejor</span>
                    <span>{pct}% del mes</span>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                    <button className="icon-btn" aria-label="Editar" onClick={() => openEdit(habit)} style={{ background: 'transparent', border: 'none', color: '#666', borderRadius: 8, padding: 8, cursor: 'pointer', display: 'flex' }}><Edit3 size={15} /></button>
                    <button className="icon-btn" aria-label="Borrar" onClick={() => deleteHabit(habit.id)} style={{ background: 'transparent', border: 'none', color: '#666', borderRadius: 8, padding: 8, cursor: 'pointer', display: 'flex' }}><Trash2 size={15} /></button>
                  </div>
                </div>
                {/* Días del mes en 2 filas (16 + 15) con el número encima de cada cuadrito. Menos columnas = cuadritos más grandes. */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(16, 1fr)', columnGap: 4, rowGap: 8 }}>
                  {cells.map((c) => {
                    const marked = c.valid && !!habit.checks[c.date];
                    const isTodayCell = c.valid && c.date === today;
                    return (
                      <div key={'u' + c.day} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                        <span style={{ fontSize: 9.5, lineHeight: 1, fontWeight: isTodayCell ? 700 : 400, color: c.valid ? (isTodayCell ? ACCENT : '#8a7f66') : 'transparent' }}>{c.day}</span>
                        {c.valid ? (
                          <div className="cell" title={friendlyDate(c.date)} onClick={() => toggleCheck(habit.id, c.date)}
                            style={{ width: '100%', aspectRatio: '1', borderRadius: 5, cursor: 'pointer', background: marked ? habit.color : UNMARKED, opacity: marked ? 1 : 0.55, border: isTodayCell ? `2px solid ${marked ? '#fff' : ACCENT}` : 'none', boxSizing: 'border-box' }} />
                        ) : (
                          // Día que este mes no tiene (p. ej. el 31 en un mes de 30): vacío e inactivo
                          <div title="Este mes no llega a ese día" style={{ width: '100%', aspectRatio: '1', borderRadius: 5, background: 'transparent', border: `1px dashed ${BORDER}`, opacity: 0.35, boxSizing: 'border-box' }} />
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Modal */}
      {modalOpen && (
        <div onClick={() => setModalOpen(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(4px)', zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <div className="fade-in" onClick={(e) => e.stopPropagation()} style={{ background: '#1c1509', width: '100%', maxWidth: 420, borderRadius: 14, padding: 24, border: `1px solid ${BORDER}` }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <div className="serif" style={{ fontSize: 20, fontWeight: 600 }}>{editingId ? 'Editar práctica' : 'Nueva práctica'}</div>
              <button className="icon-btn" aria-label="Cerrar" onClick={() => setModalOpen(false)} style={{ background: 'transparent', border: 'none', color: '#666', borderRadius: 8, padding: 6, cursor: 'pointer', display: 'flex' }}><X size={18} /></button>
            </div>
            <label style={{ display: 'block', fontSize: 12, color: '#888', marginBottom: 6 }}>Nombre</label>
            <input className="name-input" autoFocus value={formName} onChange={(e) => setFormName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') saveHabit(); }} placeholder="Ej: Pranayama"
              style={{ width: '100%', boxSizing: 'border-box', background: '#140e06', border: `1px solid ${BORDER}`, borderRadius: 10, padding: '10px 14px', color: '#e8e8e8', fontSize: 14, marginBottom: 18, transition: 'border-color 0.15s ease' }} />
            <label style={{ display: 'block', fontSize: 12, color: '#888', marginBottom: 6 }}>Emoji</label>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(10, 1fr)', gap: 6, marginBottom: 18 }}>
              {EMOJIS.map((em) => (
                <button key={em} aria-label={`Emoji ${em}`} onClick={() => setFormEmoji(em)}
                  style={{ fontSize: 17, padding: '5px 0', borderRadius: 8, cursor: 'pointer', background: formEmoji === em ? `${ACCENT}33` : 'transparent', border: `1px solid ${formEmoji === em ? ACCENT : 'transparent'}` }}>{em}</button>
              ))}
            </div>
            <label style={{ display: 'block', fontSize: 12, color: '#888', marginBottom: 6 }}>Color</label>
            <div style={{ display: 'flex', gap: 8, marginBottom: 24, flexWrap: 'wrap' }}>
              {COLORS.map((c) => (
                <button key={c} aria-label={`Color ${c}`} onClick={() => setFormColor(c)}
                  style={{ width: 32, height: 32, borderRadius: '50%', background: c, cursor: 'pointer', border: formColor === c ? '2px solid #fff' : '2px solid transparent' }} />
              ))}
            </div>
            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10 }}>
              <button onClick={() => setModalOpen(false)} style={{ background: 'transparent', border: 'none', color: '#999', fontSize: 14, padding: '10px 16px', borderRadius: 10, cursor: 'pointer' }}>Cancelar</button>
              <button className="btn-primary" onClick={saveHabit} style={{ display: 'flex', alignItems: 'center', gap: 8, background: ACCENT, color: '#2a1c06', border: 'none', borderRadius: 10, padding: '10px 18px', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
                <Check size={16} /> {editingId ? 'Guardar' : 'Crear'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
//  COPIA DE SEGURIDAD — exporta/importa todo cifrado
// ============================================================
function BackupModal({ onClose }) {
  const [msg, setMsg] = useState('');
  const fileRef = useRef(null);

  async function doExport() {
    try {
      const keys = ['vault-meta', 'habits-data', 'dreams-data'];
      const data = {};
      for (const k of keys) {
        const r = await window.storage.get(k, false);
        if (r && r.value) data[k] = r.value;
      }
      if (!Object.keys(data).length) { setMsg('Aún no hay nada que respaldar.'); return; }
      const payload = JSON.stringify({ app: 'luz-dorada', v: 1, fecha: new Date().toISOString(), data });
      const blob = new Blob([payload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'luz-dorada-respaldo-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setMsg('✓ Copia descargada. Guárdala en un lugar seguro — sigue cifrada, tu llave es necesaria para abrirla.');
    } catch (e) { setMsg('No se pudo crear la copia.'); }
  }

  async function doImport(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || parsed.app !== 'luz-dorada' || !parsed.data) { setMsg('Ese archivo no es una copia válida.'); return; }
      for (const [k, v] of Object.entries(parsed.data)) { await window.storage.set(k, v, false); }
      setMsg('✓ Copia restaurada. Recargando…');
      setTimeout(() => location.reload(), 1300);
    } catch (e) { setMsg('No se pudo leer la copia.'); }
  }

  return (
    <div className="vault-overlay" onClick={onClose}>
      <div className="vault-box fade-in" onClick={(e) => e.stopPropagation()}>
        <div className="vault-icon">💾</div>
        <h2 className="mystic vault-title">Copia de seguridad</h2>
        <p className="vault-sub">Guarda una copia de todo (prácticas y sueños) por si cambias de teléfono. La copia va cifrada: solo tu llave puede abrirla.</p>
        <button className="vault-btn" onClick={doExport}>Descargar copia</button>
        <button className="backup-secondary" onClick={() => fileRef.current && fileRef.current.click()}>Restaurar desde una copia</button>
        <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: 'none' }}
          onChange={(e) => doImport(e.target.files && e.target.files[0])} />
        {msg && <div className="backup-msg">{msg}</div>}
        <button className="backup-close" onClick={onClose}>Cerrar</button>
      </div>
    </div>
  );
}

// ============================================================
//  CANDADO — pide la llave secreta para entrar (crear o abrir)
// ============================================================
function VaultGate({ mode, onUnlocked, onClose }) {
  const [pass, setPass] = useState('');
  const [pass2, setPass2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const creating = mode === 'create';

  async function submit() {
    setErr('');
    if (!pass) { setErr('Escribe tu llave secreta.'); return; }
    if (creating) {
      if (pass.length < 4) { setErr('Usa al menos 4 caracteres.'); return; }
      if (pass !== pass2) { setErr('Las dos llaves no coinciden.'); return; }
      setBusy(true);
      try { await vaultCreate(pass); onUnlocked(); }
      catch (e) { setErr('No se pudo crear la bóveda aquí. Ábrela desde el enlace seguro (https).'); setBusy(false); }
    } else {
      setBusy(true);
      try { await vaultUnlock(pass); onUnlocked(); }
      catch (e) { setErr('Llave incorrecta. Inténtalo de nuevo.'); setBusy(false); }
    }
  }

  return (
    <div className="vault-overlay" onClick={onClose}>
      <div className="vault-box fade-in" onClick={(e) => e.stopPropagation()}>
        <div className="vault-icon">🔒</div>
        <h2 className="mystic vault-title">{creating ? 'Crea tu llave secreta' : 'Introduce tu llave'}</h2>
        <p className="vault-sub">
          {creating
            ? 'Solo tú la conocerás. Con ella se cifra todo lo que escribas — nadie más podrá leerlo.'
            : 'Tu llave abre la bóveda. Todo lo tuyo está cifrado y protegido.'}
        </p>
        <input className="vault-input" type="password" value={pass} autoFocus
          placeholder={creating ? 'Tu llave secreta' : 'Tu llave'}
          onChange={(e) => setPass(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter' && !creating) submit(); }} />
        {creating && (
          <input className="vault-input" type="password" value={pass2}
            placeholder="Repite la llave"
            onChange={(e) => setPass2(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} />
        )}
        {err && <div className="vault-err">{err}</div>}
        {creating && (
          <div className="vault-warn">⚠️ Guárdala muy bien: si la olvidas, <b>nadie</b> podrá recuperar lo escrito. Esa es tu garantía de privacidad total.</div>
        )}
        <button className="vault-btn" onClick={submit} disabled={busy}>
          {busy ? 'Abriendo…' : (creating ? 'Crear y entrar' : 'Abrir')}
        </button>
      </div>
    </div>
  );
}

// ============================================================
//  APP — orquesta las vistas
// ============================================================
function App() {
  const [view, setView] = useState('welcome'); // welcome | temple | practicas | suenos
  const [unlocked, setUnlocked] = useState(false);
  const [gate, setGate] = useState(null); // null | 'create' | 'unlock'

  async function handleOpenDoor() {
    if (unlocked) { setView('temple'); return; }
    const exists = await vaultExists();
    setGate(exists ? 'unlock' : 'create');
  }
  function onUnlocked() { setUnlocked(true); setGate(null); setView('temple'); }

  return (
    <div className="app-root">
      {view === 'welcome' && <WelcomeScreen key="welcome" onOpen={handleOpenDoor} />}
      {view === 'temple' && <TempleInterior key="temple" onSelect={setView} onBack={() => setView('welcome')} />}
      {view === 'practicas' && <HabitTracker key="practicas" onBack={() => setView('temple')} />}
      {view === 'suenos' && <DreamJournal key="suenos" onBack={() => setView('temple')} />}
      {gate && <VaultGate mode={gate} onUnlocked={onUnlocked} onClose={() => setGate(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  .mystic { font-family: 'Cinzel', Georgia, serif; letter-spacing: 0.02em; }
  .app-root { font-family: system-ui, 'Segoe UI', BlinkMacSystemFont, sans-serif; color: #e8e8e8; }

  .loading { min-height: 100vh; background: #0b0a14; display: flex; align-items: center; justify-content: center; color: #888; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
  .view-fade { animation: sceneIn 0.6s ease; }

  /* ---------- Portada (imagen real) ---------- */
  .scene-portada {
    position: relative; min-height: 100vh; min-height: 100dvh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #0b0a14;
  }
  .portada-blur {
    position: absolute; inset: -60px; z-index: 0;
    background: url('assets/portada.jpg') center/cover no-repeat;
    filter: blur(28px) brightness(0.72) saturate(1.2);
    transform: scale(1.14);
  }
  .portada-frame {
    position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%;
    cursor: pointer; outline: none; line-height: 0;
    animation: portadaIn 1.1s ease both;
  }
  .portada-frame:focus-visible { box-shadow: 0 0 0 3px rgba(255, 214, 120, 0.7), 0 24px 90px rgba(0,0,0,0.75); }
  .portada-img {
    display: block; width: 100%; height: 100%; object-fit: cover; object-position: center;
    user-select: none; -webkit-user-drag: none;
    animation: kenburns 30s ease-in-out infinite alternate;
    transform-origin: center 62%;
  }
  @keyframes portadaIn { from { opacity: 0; transform: scale(0.985); } to { opacity: 1; transform: scale(1); } }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.045); } }

  /* Halo suave que respira sobre el botón "ABRE LA PUERTA" (sin bordes, no se desalinea) */
  .portada-door-glow {
    position: absolute; left: 50%; top: 85%; transform: translate(-50%, -50%);
    width: 80%; height: 15%; border-radius: 50%;
    pointer-events: none; z-index: 3; mix-blend-mode: screen;
    background: radial-gradient(ellipse at center, rgba(255, 226, 150, 0.55) 0%, rgba(255, 205, 110, 0.16) 45%, transparent 72%);
    animation: doorPulse 2.8s ease-in-out infinite;
  }
  @keyframes doorPulse {
    0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.95); }
    50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.06); }
  }
  .portada-frame:hover .portada-door-glow { animation-duration: 1.5s; }

  /* Mariposas que revolotean sobre la portada (encima de la imagen) */
  .pfly-wrap {
    position: absolute; z-index: 2; pointer-events: none; will-change: transform; opacity: 0.9;
    animation-iteration-count: infinite; animation-timing-function: ease-in-out;
  }
  .pfly-img {
    display: block; transform-origin: center;
    filter: drop-shadow(0 3px 7px rgba(0, 0, 0, 0.4)) saturate(0.85) brightness(0.95);
    animation: pflutter 0.9s ease-in-out infinite alternate;
  }
  @keyframes pflutter { from { transform: scaleX(1) rotate(0deg); } to { transform: scaleX(0.72) rotate(-2deg); } }
  @keyframes flyA {
    0% { transform: translate(0, 0) rotate(-6deg); }
    30% { transform: translate(28px, -32px) rotate(5deg); }
    60% { transform: translate(62px, -8px) rotate(-4deg); }
    100% { transform: translate(0, 0) rotate(-6deg); }
  }
  @keyframes flyB {
    0% { transform: translate(0, 0) rotate(5deg); }
    35% { transform: translate(-36px, 24px) rotate(-6deg); }
    70% { transform: translate(-60px, -14px) rotate(4deg); }
    100% { transform: translate(0, 0) rotate(5deg); }
  }

  /* Chispas doradas ascendentes */
  .portada-sparks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 3; }
  .spark {
    position: absolute; bottom: -12px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, #ffe6a3 0%, rgba(255, 200, 90, 0.35) 60%, transparent 75%);
    animation-name: rise; animation-iteration-count: infinite; animation-timing-function: linear;
  }
  @keyframes rise {
    0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
    12% { opacity: 0.9; }
    85% { opacity: 0.65; }
    100% { transform: translate(var(--drift), -82vh) scale(1); opacity: 0; }
  }

  /* ---------- Interior del templo (imagen real con pergaminos) ---------- */
  .scene-interior {
    position: relative; min-height: 100vh; min-height: 100dvh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #0b0a14;
  }
  .interior-blur {
    position: absolute; inset: -60px; z-index: 0;
    background: url('assets/interior.jpg') center/cover no-repeat;
    filter: blur(30px) brightness(0.66) saturate(1.12);
    transform: scale(1.14);
  }
  .interior-frame {
    position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; line-height: 0;
    animation: portadaIn 1s ease both;
  }
  .interior-img {
    display: block; width: 100%; height: 100%; object-fit: cover; object-position: center;
    user-select: none; -webkit-user-drag: none;
  }
  /* Zonas clicables sobre cada pergamino */
  .scroll-zone {
    position: absolute; z-index: 3; cursor: pointer; border: none; background: transparent;
    outline: none;
  }
  .zone-practicas { left: 5.5%; top: 43%; width: 36%; height: 46%; }
  .zone-suenos { left: 54.5%; top: 43%; width: 36%; height: 46%; }
  /* Luz dorada que se enciende y respira al pasar el cursor / tocar el pergamino */
  .scroll-zone:hover, .scroll-zone:focus-visible, .scroll-zone:active {
    background: radial-gradient(ellipse 72% 58% at 50% 48%, rgba(255,226,150,0.32), rgba(255,205,110,0.13) 45%, rgba(255,205,110,0) 70%);
    mix-blend-mode: screen;
    animation: zoneGlow 1.7s ease-in-out infinite;
  }
  @keyframes zoneGlow { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  .interior-back {
    position: absolute; top: calc(22px + env(safe-area-inset-top)); left: calc(22px + env(safe-area-inset-left)); z-index: 8;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(20, 16, 30, 0.6); border: 1px solid rgba(255, 255, 255, 0.14);
    color: #e6dcc4; border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    font-family: 'Cinzel', serif; letter-spacing: 0.06em; backdrop-filter: blur(6px);
    transition: background 0.2s ease;
  }
  .interior-back:hover { background: rgba(40, 32, 58, 0.85); }
  .interior-backup {
    position: absolute; top: calc(22px + env(safe-area-inset-top)); right: calc(22px + env(safe-area-inset-right)); z-index: 8;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(20, 16, 30, 0.6); border: 1px solid rgba(255, 255, 255, 0.14);
    color: #e6dcc4; border-radius: 999px; padding: 8px 15px; font-size: 12px; cursor: pointer;
    font-family: 'Cinzel', serif; letter-spacing: 0.05em; backdrop-filter: blur(6px); transition: background 0.2s ease;
  }
  .interior-backup:hover { background: rgba(40, 32, 58, 0.85); }
  .backup-secondary {
    width: 100%; margin-top: 10px; cursor: pointer; border-radius: 999px;
    background: transparent; border: 1px solid #4a3f6b; color: #c9bdf0;
    font-family: inherit; font-size: 14px; padding: 11px 16px; transition: background 0.15s ease;
  }
  .backup-secondary:hover { background: #221a3a; }
  .backup-msg { margin-top: 14px; font-size: 12px; line-height: 1.5; color: #c9bd8a; }
  .backup-close { margin-top: 16px; background: transparent; border: none; color: #8a8098; font-size: 13px; cursor: pointer; }
  .backup-close:hover { color: #cfc6df; }

  /* ---------- Escenas a pantalla completa ---------- */
  .scene { position: relative; width: 100%; min-height: 100vh; overflow: hidden; }
  .scene-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .star { animation: twinkle ease-in-out infinite; }

  @keyframes doorAura { 0%, 100% { opacity: 0.28; } 50% { opacity: 0.55; } }
  .door-aura { animation: doorAura 3s ease-in-out infinite; }
  .temple-door { transition: transform 0.3s ease; transform-box: fill-box; transform-origin: center; }
  .temple-door:hover { transform: scale(1.05); }

  /* ---------- Portada ---------- */
  .butterflies { position: absolute; inset: 0; pointer-events: none; }
  .butterfly { position: absolute; will-change: transform; }
  .butterfly .wing { transform-box: fill-box; transform-origin: 17px 13px; animation: flutter 0.35s ease-in-out infinite alternate; }
  .butterfly .wing-r { animation-delay: 0.02s; }
  @keyframes flutter { from { transform: scaleX(1); } to { transform: scaleX(0.55); } }
  @keyframes floatA {
    0%   { transform: translate(0,0) rotate(-4deg); }
    25%  { transform: translate(40px,-30px) rotate(6deg); }
    50%  { transform: translate(80px,-6px) rotate(-3deg); }
    75%  { transform: translate(35px,26px) rotate(5deg); }
    100% { transform: translate(0,0) rotate(-4deg); }
  }
  @keyframes floatB {
    0%   { transform: translate(0,0) rotate(3deg); }
    25%  { transform: translate(-45px,20px) rotate(-6deg); }
    50%  { transform: translate(-70px,-14px) rotate(4deg); }
    75%  { transform: translate(-30px,-34px) rotate(-4deg); }
    100% { transform: translate(0,0) rotate(3deg); }
  }
  .butterfly { animation: floatA linear infinite; }

  .welcome-content {
    position: relative; z-index: 5; min-height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
    padding: 7vh 20px 9vh; text-align: center;
  }
  .welcome-title { margin-top: 2vh; }
  .w-greet { font-family: 'Cinzel', serif; font-size: clamp(15px, 2.4vw, 20px); letter-spacing: 0.22em; color: #f0e2c4; text-transform: uppercase; opacity: 0.92; }
  .w-name { font-family: 'Cinzel Decorative', 'Cinzel', serif; font-weight: 700; font-size: clamp(30px, 6.5vw, 58px); color: #f3ce7e; margin: 8px 0 6px; letter-spacing: 0.03em; text-shadow: 0 0 26px rgba(240,190,90,0.45), 0 2px 10px rgba(0,0,0,0.5); }
  .w-sub { font-family: 'Cinzel', serif; font-size: clamp(14px, 2.6vw, 22px); letter-spacing: 0.14em; color: #e7d6b4; opacity: 0.9; }

  .door-prompt {
    margin-top: auto; display: inline-flex; align-items: center; gap: 14px;
    font-family: 'Cinzel', serif; font-size: clamp(16px, 2.6vw, 22px); letter-spacing: 0.14em;
    color: #22170a; background: linear-gradient(135deg, #ffdd92, #e5a94e);
    border: none; border-radius: 999px; padding: 14px 34px; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,225,150,0.5), 0 0 34px rgba(232,169,78,0.5);
    animation: breathe 3.4s ease-in-out infinite; transition: transform 0.2s ease;
  }
  .door-prompt:hover { transform: translateY(-2px) scale(1.03); }
  .door-prompt:active { transform: scale(0.98); }
  .door-orn { color: #6a4718; font-size: 0.8em; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 1px rgba(255,225,150,0.5), 0 0 28px rgba(232,169,78,0.4); } 50% { box-shadow: 0 0 0 1px rgba(255,225,150,0.7), 0 0 46px rgba(232,169,78,0.75); } }

  /* ---------- Interior del templo ---------- */
  .temple-content { position: relative; z-index: 5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; box-sizing: border-box; }
  .temple-heading { text-align: center; margin-bottom: 48px; }
  .t-eyebrow { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: #b39ddb; opacity: 0.8; }
  .t-title { font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(32px, 6vw, 52px); color: #f0e6d0; margin: 10px 0 6px; text-shadow: 0 0 24px rgba(224,178,90,0.3); }
  .t-sub { font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 0.14em; color: #cbb98f; }

  .temple-back, .back-link {
    position: absolute; top: calc(22px + env(safe-area-inset-top)); left: calc(22px + env(safe-area-inset-left)); z-index: 8;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(20,16,30,0.6); border: 1px solid rgba(255,255,255,0.14);
    color: #d7cceb; border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    font-family: 'Cinzel', serif; letter-spacing: 0.06em; backdrop-filter: blur(6px); transition: background 0.2s ease;
  }
  .temple-back:hover, .back-link:hover { background: rgba(40,32,58,0.85); }

  .windows { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
  .window {
    width: 230px; max-width: 42vw; min-width: 180px; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0;
    transition: transform 0.25s ease;
  }
  .window:hover { transform: translateY(-8px); }
  .window-arch {
    position: relative; width: 100%; height: 260px; border-radius: 115px 115px 14px 14px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.15);
  }
  .window-practicas .window-arch { background: linear-gradient(180deg, #5a4020, #241a12); border-color: rgba(224,178,90,0.5); box-shadow: 0 0 40px rgba(224,178,90,0.18) inset, 0 10px 40px rgba(0,0,0,0.4); }
  .window-suenos .window-arch { background: linear-gradient(180deg, #2f2758, #16122b); border-color: rgba(138,122,199,0.55); box-shadow: 0 0 40px rgba(138,122,199,0.2) inset, 0 10px 40px rgba(0,0,0,0.4); }
  .window-glow { position: absolute; top: 40px; width: 120px; height: 120px; border-radius: 50%; filter: blur(26px); }
  .glow-gold { background: radial-gradient(circle, rgba(255,214,130,0.9), transparent 70%); }
  .glow-dream { background: radial-gradient(circle, rgba(160,140,230,0.85), transparent 70%); }
  .window-arch > svg { position: relative; z-index: 2; }
  .window:hover .window-arch { border-color: rgba(255,255,255,0.4); }
  .window-label { font-family: 'Cinzel', serif; font-weight: 600; font-size: 19px; color: #f0e8da; letter-spacing: 0.04em; }
  .window-hint { font-size: 12px; color: #9c93b0; margin-top: -6px; }

  /* ---------- Secciones internas (prácticas / sueños) ---------- */
  .section { min-height: 100vh; background: #0f0f0f; }
  .section-suenos { position: relative; background: #05060f; }
  .section-suenos::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: url('assets/suenos.jpg') center/cover no-repeat;
    filter: brightness(0.72) saturate(1.1);
    transform: scale(1.05);
  }
  .section-suenos::after {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(20, 16, 48, 0.30), transparent 55%),
      linear-gradient(180deg, rgba(5, 6, 18, 0.52) 0%, rgba(4, 5, 12, 0.40) 45%, rgba(3, 4, 10, 0.60) 100%);
  }
  .section-suenos .section-inner { position: relative; z-index: 1; }
  .section-practicas { position: relative; background: #0e0a05; }
  .section-practicas::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: url('assets/interior.jpg') center/cover no-repeat;
    filter: blur(6px) brightness(0.46) saturate(0.95);
    transform: scale(1.14);
  }
  .section-practicas::after {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(130% 80% at 50% 0%, rgba(80, 52, 16, 0.35), transparent 60%),
      linear-gradient(180deg, rgba(10, 7, 3, 0.28) 0%, rgba(8, 5, 2, 0.55) 100%);
  }
  .section-inner { max-width: 720px; margin: 0 auto; padding: 74px 20px 90px; position: relative; }
  .section-practicas .section-inner { max-width: 880px; position: relative; z-index: 1; }

  .section-head { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .head-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* Recuadro de fecha del diario */
  .date-box {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #150f26; border: 1px solid #33294f; border-radius: 14px; padding: 12px 14px;
  }
  .date-selects { display: flex; gap: 8px; flex: 1; }
  .date-selects select { flex: 1; }
  .date-nav { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; background: #221a38; border: 1px solid #3a3152; color: #c9bdf0; cursor: pointer; transition: background 0.15s ease; }
  .date-nav:hover { background: #2e2450; }
  .today-badge { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em; color: #1a1230; background: #c9bdf0; border-radius: 999px; padding: 5px 14px; text-transform: uppercase; font-weight: 600; }
  .today-btn { font-size: 12px; color: #c9bdf0; background: transparent; border: 1px solid #4a3f6b; border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: background 0.15s ease; }
  .today-btn:hover { background: #241c3a; }
  .date-caption { color: #9a8fb8; font-size: 13px; margin: 12px 2px 18px; text-transform: capitalize; }

  .dream-wrap { position: relative; }
  .dream-text {
    width: 100%; box-sizing: border-box; min-height: 320px; resize: vertical;
    background: #120d20; border: 1px solid #2e2547; border-radius: 14px; padding: 18px 20px;
    color: #e8e2f5; font-family: 'Fraunces', Georgia, serif; font-size: 16px; line-height: 1.75;
    transition: border-color 0.15s ease;
  }
  .dream-text:focus { outline: none; border-color: #6d5aa8; }
  .dream-text::placeholder { color: #5a5177; font-style: italic; }
  .dream-status { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 12px; font-size: 12px; color: #6f6690; }
  .dream-saved { display: inline-flex; align-items: center; gap: 6px; }
  .mic-btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    background: #221a3a; color: #d7cbf5; border: 1px solid #4a3f6b;
    border-radius: 999px; padding: 9px 18px; font-size: 13px; font-weight: 600;
    font-family: inherit; transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .mic-btn:hover { background: #2c2350; border-color: #6d5aa8; }
  .mic-btn:active { transform: scale(0.97); }
  .mic-btn.listening {
    background: #7a2340; border-color: #d05a78; color: #ffe1ea;
    animation: micPulse 1.3s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224, 90, 122, 0.5); }
    50% { box-shadow: 0 0 0 8px rgba(224, 90, 122, 0); }
  }
  .mic-off { color: #6f6690; font-style: italic; }
  .mic-note { margin-top: 10px; font-size: 11px; line-height: 1.5; color: #6f6690; }
  .mic-error { margin-top: 8px; font-size: 12px; color: #e0a0b4; background: rgba(122, 35, 64, 0.25); border: 1px solid #7a2340; border-radius: 8px; padding: 8px 12px; }

  /* ---------- Estilos compartidos del rastreador ---------- */
  .cell { transition: transform 0.12s ease, background 0.2s ease; cursor: pointer; }
  .cell:hover { transform: scale(1.15); }
  .cell:active { transform: scale(0.92); }
  .btn-primary { transition: background 0.15s ease, transform 0.1s ease; }
  .btn-primary:hover { background: #ecc063 !important; }
  .btn-primary:active { transform: scale(0.97); }
  .habit-card { transition: border-color 0.2s ease; }
  .habit-card:hover { border-color: #6a4f22 !important; }
  .icon-btn { transition: color 0.15s ease, background 0.15s ease; }
  .icon-btn:hover { color: #fff !important; background: #222 !important; }
  .name-input:focus { border-color: #d9a63f !important; outline: none; }

  /* ---------- Candado / Bóveda ---------- */
  .vault-overlay {
    position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(6, 5, 12, 0.82); backdrop-filter: blur(8px);
  }
  .vault-box {
    width: 100%; max-width: 380px; text-align: center;
    background: linear-gradient(180deg, #171021, #0f0a16);
    border: 1px solid #3a2c55; border-radius: 18px; padding: 30px 26px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7), 0 0 60px rgba(224, 178, 90, 0.08) inset;
  }
  .vault-icon { font-size: 34px; margin-bottom: 8px; }
  .vault-title { font-size: 23px; color: #f0e6d0; margin: 0 0 8px; }
  .vault-sub { font-size: 13px; color: #a99ec4; line-height: 1.55; margin: 0 0 20px; }
  .vault-input {
    width: 100%; box-sizing: border-box; text-align: center;
    background: #0c0814; border: 1px solid #3a2c55; border-radius: 10px;
    padding: 12px 14px; color: #ece6f6; font-size: 15px; margin-bottom: 12px; letter-spacing: 0.05em;
    transition: border-color 0.15s ease;
  }
  .vault-input:focus { outline: none; border-color: #d9a63f; }
  .vault-err { font-size: 13px; color: #e7a2b4; margin: 2px 0 12px; }
  .vault-warn {
    font-size: 12px; color: #d8c48a; line-height: 1.5; text-align: left;
    background: rgba(120, 90, 20, 0.14); border: 1px solid #5a4620; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 16px;
  }
  .vault-btn {
